name: basketball_tracker_rtx
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  # Python
  - python=3.11

  # PyTorch with CUDA support (optimized for RTX GPUs)
  # For CUDA 12.1 (RTX 40xx series recommended)
  - pytorch>=2.2.0
  - torchvision>=0.17.0
  - torchaudio>=2.2.0
  - pytorch-cuda=12.1

  # Alternative for CUDA 11.8 (RTX 30xx, 20xx series)
  # Uncomment if you have older GPU and comment out the 12.1 versions above:
  # - pytorch-cuda=11.8

  # Computer Vision
  - opencv>=4.10.0

  # Scientific Computing
  - numpy>=1.26.0
  - scipy>=1.11.0

  # Data Science
  - pandas>=2.1.0
  - scikit-learn>=1.4.0

  # Visualization
  - matplotlib>=3.8.0
  - seaborn>=0.13.0

  # Performance
  - numba>=0.59.0  # JIT compilation

  # Utilities
  - pyyaml>=6.0.1
  - pillow>=10.0.0
  - psutil>=5.9.0  # System monitoring

  # Development tools (optional)
  - jupyter
  - ipython
  - pytest

  # Pip packages (not available on conda)
  - pip
  - pip:
    # Deep Learning
    - ultralytics>=8.3.0  # YOLO (supports v8, v9, v11) with CUDA support
    - transformers>=4.40.0  # Fashion CLIP for team classification

    # Tracking
    - filterpy>=1.4.5
    - deep-sort-realtime>=1.3.2
    - boxmot>=10.0.0

    # Fast similarity search
    # Note: faiss-gpu has limited Python version support on Windows
    # Using faiss-cpu as fallback (still fast enough for basketball tracking)
    - faiss-cpu>=1.8.0  # Fast similarity search for ReID

    # Professional visualizations
    - mplbasketball>=1.0.0

    # Performance monitoring
    - py3nvml>=0.2.7  # NVIDIA GPU monitoring
    - gputil>=1.4.0  # GPU utilities

    # Optional: TensorRT for maximum inference speed
    # Requires separate TensorRT installation from NVIDIA
    # - tensorrt>=8.6.0

    # Optional: ONNX for model export
    # - onnx>=1.15.0
    # - onnxruntime-gpu>=1.17.0

# Platform-specific notes:
# Windows users should install this environment using:
#   conda env create -f environment_rtx.yml
#
# To verify CUDA installation:
#   python -c "import torch; print(torch.cuda.is_available())"
#   python -c "import torch; print(torch.cuda.get_device_name(0))"
#
# To update environment:
#   conda env update -f environment_rtx.yml --prune
